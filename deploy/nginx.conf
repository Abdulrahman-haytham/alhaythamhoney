# Load in Nginx's http context (e.g. /etc/nginx/conf.d/alhaytham.conf).
limit_req_zone $binary_remote_addr zone=haytham_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=haytham_reviews:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=haytham_uploads:10m;

server {
    listen 80;
    server_name alhaythamhoney.sy;
    server_tokens off;
    # Covers bounded article/campaign JSON; each handler enforces its own smaller limit.
    client_max_body_size 256k;
    client_body_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;

    # Certbot adds the HTTPS listener/certificates; redirect HTTP before accepting logins.
    # Overwrite X-Client-IP: the app never trusts a visitor's X-Forwarded-For.
    proxy_set_header X-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_buffering off;

    location = /api/admin/login {
        limit_req zone=haytham_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3005;
    }
    location = /api/reviews {
        limit_req zone=haytham_reviews burst=5 nodelay;
        proxy_pass http://127.0.0.1:3005;
    }
    location = /api/admin/studio {
        client_max_body_size 64m;
        limit_conn haytham_uploads 2;
        proxy_pass http://127.0.0.1:3005;
    }
    location / { proxy_pass http://127.0.0.1:3005; }
}

server {
    listen 80;
    server_name www.alhaythamhoney.sy;
    return 301 https://alhaythamhoney.sy$request_uri;
}
