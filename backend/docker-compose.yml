services:
  postgres:
    image: postgres:16-alpine
    container_name: alhaytham_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-alhaytham_honey}
      POSTGRES_USER: ${DB_USER:-alhaytham_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_secure_password}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-alhaytham_user} -d ${DB_NAME:-alhaytham_honey}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
