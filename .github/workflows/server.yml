name: Server
# Drive the VPS from a phone: Actions → Server → Run workflow (or via the API).
# Needs repository secrets VPS_HOST and VPS_SSH_KEY; optional VPS_USER (root),
# VPS_PORT (22), VPS_APP_DIR (/opt/alhaytham), VPS_KNOWN_HOSTS, ADMIN_PASSWORD.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to run on the server
        type: choice
        default: status
        options:
          [status, deploy, logs, restart, backup, migrate, seed, jobs, rollback, bootstrap, shell]
      arg:
        description: 'deploy: SHA (empty = latest nextjs) · logs: "app 200" · rollback: SHA · bootstrap: site URL · shell: command'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: vps
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Connect
        env:
          HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          PORT: ${{ secrets.VPS_PORT || vars.VPS_PORT }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST_IN_VARS: ${{ vars.VPS_HOST != '' }}
          KEY_IN_VARS: ${{ vars.VPS_SSH_KEY != '' }}
        run: |
          # A one-line base64 copy of the key is easier to paste from a phone.
          if [ -z "$KEY" ] && [ -n "$KEY_B64" ]; then KEY=$(printf '%s' "$KEY_B64" | tr -d ' \r\n' | base64 -d); fi
          # Undo what mobile pasting tends to do: CRLF line ends, or the whole key on one line.
          KEY=$(printf '%s\n' "$KEY" | tr -d '\r')
          if [ -n "$KEY" ] && [ "$(printf '%s\n' "$KEY" | wc -l)" -lt 3 ]; then
            KEY=$(printf '%s' "$KEY" | sed -E 's/-----(BEGIN|END) ([A-Z ]+)-----/\n&\n/g' | sed -E '/^-----/!s/ +/\n/g' | sed '/^$/d')
          fi
          for n in HOST KEY PORT KNOWN; do printf '%-6s %s\n' "$n" "$([ -n "${!n}" ] && echo set || echo empty)"; done
          echo "VPS_HOST saved as a variable: $HOST_IN_VARS"
          if [ "$KEY_IN_VARS" = true ]; then echo "::error::VPS_SSH_KEY was saved as a Variable, which is not hidden. Delete it there and add it under the Secrets tab."; exit 1; fi
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::error::Missing $([ -z "$HOST" ] && echo VPS_HOST) $([ -z "$KEY" ] && echo VPS_SSH_KEY or VPS_SSH_KEY_B64) — add them under Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi
          case "$KEY" in *"BEGIN OPENSSH PRIVATE KEY"*|*"BEGIN RSA PRIVATE KEY"*|*"BEGIN EC PRIVATE KEY"*) ;; *) echo "::error::VPS_SSH_KEY does not look like a private key (paste the whole file, BEGIN to END)."; exit 1 ;; esac
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_vps && chmod 600 ~/.ssh/id_vps
          if ! pub=$(ssh-keygen -y -f ~/.ssh/id_vps 2>&1); then echo "::error::The SSH key could not be read: $pub"; exit 1; fi
          echo "key: $(ssh-keygen -lf ~/.ssh/id_vps | awk '{print $2, $3}')"
          # Tolerate "root@1.2.3.4", "ssh://…", "http://…/", "host:port" and stray spaces in VPS_HOST.
          # Arabic/Persian digits and invisible direction marks come from phone keyboards.
          h=$(printf '%s' "$HOST" | python3 -c 'import sys,unicodedata as u
          s=sys.stdin.read()
          bad=[c for c in s if ord(c)>127]
          if bad: print("::warning::VPS_HOST had %d non-ASCII characters (e.g. Arabic digits or direction marks); normalised them." % len(bad), file=sys.stderr)
          out="".join(str(u.digit(c)) if u.category(c)=="Nd" else "." if c in "\u066b\u066c\u06d4\u3002" else c for c in s)
          print("".join(c for c in out if 32<ord(c)<127))')
          h=${h#*://}; h=${h%%/*}
          case "$h" in *@*) u=${h%@*}; h=${h#*@} ;; esac
          case "$h" in *:*:*) ;; *:*) PORT=${PORT:-${h#*:}}; h=${h%:*} ;; esac
          PORT=${PORT:-22}
          {
            echo "VPS_HOST=$h"
            echo "VPS_PORT=$PORT"
            if [ -n "${u:-}" ]; then echo "VPS_USER_FROM_HOST=$u"; fi
          } >> "$GITHUB_ENV"
          echo "::add-mask::$h"
          if ! timeout 20 bash -c "exec 3<>/dev/tcp/$h/$PORT" 2>/dev/null; then
            if printf '%s' "$h" | grep -qE '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then kind="an IPv4 address"
            elif printf '%s' "$h" | grep -q ':'; then kind="an IPv6 address (GitHub runners have no IPv6 — use the server's IPv4)"
            else kind="a hostname of ${#h} characters that $(getent hosts "$h" >/dev/null && echo resolves || echo does NOT resolve) — expected the server IPv4 like 203.0.113.10"; fi
            open=''; for p in 22 2222 2200 22022 80 443 8080; do timeout 6 bash -c "exec 3<>/dev/tcp/$h/$p" 2>/dev/null && open="$open $p"; done
            echo "::error::VPS_HOST is $kind. Ports open from GitHub:${open:- none of 22 2222 2200 22022 80 443 8080}."
            echo "::error::Cannot reach the server on port $PORT from GitHub. Check the IP in VPS_HOST, that sshd listens on $PORT, and that the firewall/provider allows inbound SSH from the Internet."
            exit 1
          fi
          echo "port $PORT: reachable"
          if [ -n "$KNOWN" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 15 -p "$PORT" "$h" > ~/.ssh/known_hosts 2>/dev/null || true
            if [ ! -s ~/.ssh/known_hosts ]; then echo "::error::Port $PORT answers but no SSH host key came back — is it really sshd on that port?"; exit 1; fi
            echo "::warning::VPS_KNOWN_HOSTS not set — trusting the host key seen now:%0A$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2, $4}' | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
      - name: ${{ inputs.action }}
        env:
          USER_: ${{ secrets.VPS_USER || vars.VPS_USER }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ACTION: ${{ inputs.action }}
          ARG: ${{ inputs.arg }}
        run: |
          arg_b64=$(printf '%s' "$ARG" | base64 -w0)
          dir=${APP_DIR:-/opt/alhaytham}
          case "$dir" in *[!A-Za-z0-9/_.-]*) echo "::error::bad VPS_APP_DIR"; exit 1 ;; esac
          set +e
          {
            if [ "$ACTION" = bootstrap ] && [ -n "$ADMIN_PASSWORD" ]; then printf 'export ADMIN_PASSWORD=%q\n' "$ADMIN_PASSWORD"; fi
            cat deploy/remote.sh
          } | ssh -i ~/.ssh/id_vps -p "$VPS_PORT" -o BatchMode=yes -o ServerAliveInterval=30 \
                "${USER_:-${VPS_USER_FROM_HOST:-root}}@$VPS_HOST" \
                "f=\$(mktemp) && cat > \"\$f\" && bash \"\$f\" $ACTION $dir $arg_b64 < /dev/null 2>&1; rc=\$?; rm -f \"\$f\"; exit \$rc" \
            | tee "$RUNNER_TEMP/out.txt"
          rc=${PIPESTATUS[1]}
          # Also publish the output as an annotation: the API serves annotations
          # even where raw log downloads are not reachable.
          out=$(tail -c 3500 "$RUNNER_TEMP/out.txt") # annotations keep ~4 KB; the end holds the verdict
          out=${out//'%'/'%25'}; out=${out//$'\r'/'%0D'}; out=${out//$'\n'/'%0A'}
          echo "::notice title=$ACTION (exit $rc)::$out"
          exit "$rc"
