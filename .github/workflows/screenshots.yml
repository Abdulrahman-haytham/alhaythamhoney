name: Screenshots
# Phone-sized screenshots, force-pushed as a single commit to a `screenshots…`
# branch so they can be fetched with plain git from anywhere.
# - ref empty: the live site. Read-only: it only loads pages, and blocks the
#   visit counter and ad pixels so these visits do not reach the dashboard.
# - ref set: builds that branch/commit here with seed data and a throwaway
#   database, so a change can be looked at on a phone before it is deployed.
on:
  workflow_dispatch:
    inputs:
      paths:
        description: 'Comma-separated paths. "auto" adds the first product and mixture from the sitemap.'
        required: false
        default: '/,auto,/custom-mixtures,/shop'
      base:
        description: Site origin (live mode)
        required: false
        default: https://alhaythamhoney.sy
      ref:
        description: Branch or commit to build and preview with seed data (empty = live site)
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: screenshots
  cancel-in-progress: false
jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: preview-only-password
          POSTGRES_DB: haytham_preview
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:preview-only-password@127.0.0.1:5432/haytham_preview
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3005
      ADMIN_SESSION_SECRET: preview-only-session-secret-never-used-in-production-0123456789
      CHROMIUM_PATH: /usr/bin/google-chrome
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/checkout@v5
        if: inputs.ref != ''
        with:
          ref: ${{ inputs.ref }}
          path: app
      - name: Build and start the preview
        if: inputs.ref != ''
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run db:deploy
          ADMIN_USERNAME=preview ADMIN_PASSWORD=preview-only-password-1234 npm run db:seed
          # Seeded content starts unpublished so the owner reviews it; a preview wants it visible.
          psql "$DATABASE_URL" -qc 'update products set published = true; update mixtures set published = true;'
          # Two sample offers so the offers section has something to show in a preview.
          psql "$DATABASE_URL" -q <<'SQL'
          insert into promotions (id, title, kind, "minSubtotal", percent, "buyProductId", "buyQty", "giftProductId", "giftQty", "updatedAt")
          select 'preview-bxgy', 'عرض تجريبي', 'BUY_X_GET_Y', 0, 0, id, 2, id, 1, now()
          from products where category = 'HONEY' order by "sortOrder" limit 1;
          insert into promotions (id, title, kind, "minSubtotal", percent, "endsAt", "updatedAt")
          values ('preview-pct', 'عرض تجريبي', 'PERCENT_OVER_AMOUNT', 5000, 5, now() + interval '10 days', now());
          SQL
          # A sample order so /orders/HY-PREV23/invoice(.pdf) can be previewed.
          psql "$DATABASE_URL" -q <<'SQL' || true
          with items as (
            select id, name, price, weight, image, row_number() over (order by "sortOrder") as n
            from products where category = 'HONEY' and price is not null order by "sortOrder" limit 2
          ), totals as (select sum(price * n)::int as sub from items)
          insert into orders (id, reference, subtotal, discount, shipping, total, breakdown, "updatedAt")
          select 'preview-order', 'HY-PREV23', sub, 0, 25000, sub + 25000,
                 '{"shippingLabel": "حماة · 1–2 يوم"}'::jsonb, now() from totals;
          insert into order_items (id, "orderId", "productId", name, price, quantity, weight, image)
          select 'preview-item-' || n, 'preview-order', id, name, price, n::int, weight, image
          from (select id, name, price, weight, image, row_number() over (order by "sortOrder") as n
                from products where category = 'HONEY' and price is not null order by "sortOrder" limit 2) i;
          SQL
          # Sample agents, if this branch has the agents table.
          psql "$DATABASE_URL" -q <<'SQL' || true
          insert into agents (id, name, city, address, "addressDetail", "mapUrl", whatsapp, "facebookUrl", "updatedAt") values
          ('preview-a1', 'وكيل تجريبي — محل الريف', 'حماة — حي البعث', 'شارع العلمين', 'بجانب الصيدلية، الطابق الأرضي', 'https://maps.app.goo.gl/example', '963900000001', 'https://facebook.com/example', now()),
          ('preview-a2', 'وكيل تجريبي — سوق الطويل', 'حماة — السوق', 'سوق الطويل', null, 'https://maps.app.goo.gl/example2', '963900000002', null, now());
          SQL
          npm run build
          nohup npm start > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:3005/api/health >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:3005/api/health || { tail -50 "$RUNNER_TEMP/server.log"; exit 1; }
          echo "PREVIEW_BASE=http://127.0.0.1:3005" >> "$GITHUB_ENV"
          echo "SHOTS_BRANCH=screenshots-preview" >> "$GITHUB_ENV"
      - name: Install Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@^1.63.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Shoot
        env:
          PATHS: ${{ inputs.paths }}
          LIVE_BASE: ${{ inputs.base }}
        run: |
          export BASE="${PREVIEW_BASE:-$LIVE_BASE}"
          cat > "$RUNNER_TEMP/pw/shoot.mjs" <<'EOF'
          import { chromium, devices } from 'playwright';
          import fs from 'node:fs/promises';

          const out = process.argv[2];
          const base = (process.env.BASE || 'https://alhaythamhoney.sy').replace(/\/$/, '');
          let paths = (process.env.PATHS || '/').split(',').map((s) => s.trim()).filter(Boolean);
          await fs.mkdir(out, { recursive: true });

          if (paths.includes('auto')) {
            const xml = await (await fetch(`${base}/sitemap.xml`)).text();
            const locs = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map((m) => new URL(m[1]).pathname);
            const pick = (re) => locs.find((p) => re.test(p));
            paths = paths.flatMap((p) =>
              p === 'auto' ? [pick(/^\/product\/./), pick(/^\/custom-mixtures\/./)].filter(Boolean) : [p],
            );
          }

          const browser = await chromium.launch();
          const ctx = await browser.newContext({
            ...devices['Pixel 7'],
            deviceScaleFactor: 2,
            locale: 'ar-SY',
            timezoneId: 'Asia/Damascus',
          });
          await ctx.addInitScript(() => {
            try {
              Object.defineProperty(navigator, 'sendBeacon', { value: () => true });
            } catch {}
          });
          await ctx.route(/\/api\/events|google-analytics|googletagmanager|connect\.facebook\.net|facebook\.com\/tr/, (r) => r.abort());

          // Preview builds seed a throwaway admin, so dashboard pages can be shot too.
          // Never attempted against the live site.
          if (process.env.PREVIEW_BASE && paths.some((p) => p.startsWith('/admin'))) {
            const login = await ctx.request.post(`${base}/api/admin/login`, {
              headers: { origin: base },
              data: { username: 'preview', password: 'preview-only-password-1234' },
            });
            console.log('preview admin login:', login.status());
          }

          const report = [];
          for (const [i, entry] of paths.entries()) {
            // "path|css-selector" clicks that element after load (e.g. "/|[aria-controls=mobile-menu]")
            const [p, click] = entry.split('|');
            const slug = (p === '/' ? 'home' : p.replace(/^\/|\/$/g, '').replace(/[^a-z0-9]+/gi, '-')) + (click ? '-click' : '');
            const name = `${String(i + 1).padStart(2, '0')}-${slug}`.slice(0, 70);
            if (p.endsWith('.pdf')) {
              // Save the PDF and render its first page to an image for review.
              const res = await fetch(base + p);
              const buf = Buffer.from(await res.arrayBuffer());
              await fs.writeFile(`${out}/${name}.pdf`, buf);
              report.push({ path: p, name, status: res.status, type: res.headers.get('content-type'), bytes: buf.length });
              continue;
            }
            const page = await ctx.newPage();
            try {
              await page.goto(base + p, { waitUntil: 'networkidle', timeout: 60000 });
            } catch (e) {
              report.push({ path: p, error: String(e) });
              await page.close();
              continue;
            }
            await page.waitForTimeout(2000);
            if (click) {
              await page.click(click);
              await page.waitForTimeout(800);
              await page.screenshot({ path: `${out}/${name}-clicked.jpg`, type: 'jpeg', quality: 70 });
              await page.screenshot({ path: `${out}/${name}-clicked-full.jpg`, type: 'jpeg', quality: 60, fullPage: true });
              report.push({ path: entry, name });
              await page.close();
              continue;
            }
            await page.screenshot({ path: `${out}/${name}-top.jpg`, type: 'jpeg', quality: 70 });

            // Walk down the page so scroll-triggered reveals and lazy images render.
            const height = await page.evaluate(() => document.documentElement.scrollHeight);
            for (let y = 0; y < height; y += 350) {
              await page.evaluate((yy) => window.scrollTo(0, yy), y);
              await page.waitForTimeout(150);
            }
            await page.evaluate((yy) => window.scrollTo(0, yy), Math.round(height * 0.4));
            await page.waitForTimeout(900);
            await page.screenshot({ path: `${out}/${name}-mid.jpg`, type: 'jpeg', quality: 70 });
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(600);
            await page.screenshot({ path: `${out}/${name}-full.jpg`, type: 'jpeg', quality: 60, fullPage: true });

            const data = await page.evaluate(() => {
              const links = [...document.querySelectorAll('a[href]')]
                .filter((a) => /wa\.me|whatsapp|^tel:/.test(a.getAttribute('href') || ''))
                .map((a) => {
                  const cs = getComputedStyle(a);
                  const r = a.getBoundingClientRect();
                  let msg = null;
                  try {
                    msg = new URL(a.href).searchParams.get('text');
                  } catch {}
                  return {
                    kind: a.href.startsWith('tel:') ? 'tel' : 'whatsapp',
                    text: a.innerText.trim().replace(/\s+/g, ' ').slice(0, 60),
                    msg,
                    bg: cs.backgroundColor,
                    bgImage: cs.backgroundImage === 'none' ? null : cs.backgroundImage.slice(0, 80),
                    color: cs.color,
                    border: cs.borderColor,
                    size: `${Math.round(r.width)}x${Math.round(r.height)}`,
                    top: Math.round(r.top + window.scrollY),
                    fixed: !!a.closest('.fixed'),
                    visible: r.width > 0 && r.height > 0,
                  };
                });
              const sections = [...document.querySelectorAll('main section')].map((s) => ({
                id: s.id || null,
                heading: s.querySelector('h1,h2')?.innerText.trim().replace(/\s+/g, ' ').slice(0, 80) || null,
                top: Math.round(s.getBoundingClientRect().top + window.scrollY),
                height: Math.round(s.getBoundingClientRect().height),
              }));
              return { links, sections };
            });
            report.push({ path: p, name, title: await page.title(), height, ...data });
            await page.close();
          }
          await fs.writeFile(`${out}/report.json`, JSON.stringify({ base, at: new Date().toISOString(), pages: report }, null, 2));
          await browser.close();
          EOF
          cd "$RUNNER_TEMP/pw" && node shoot.mjs "$RUNNER_TEMP/shots"
      - name: Render PDF pages to images
        run: |
          ls "$RUNNER_TEMP/shots"/*.pdf >/dev/null 2>&1 || exit 0
          sudo apt-get install -y -qq poppler-utils >/dev/null
          for f in "$RUNNER_TEMP/shots"/*.pdf; do pdftoppm -jpeg -r 110 "$f" "${f%.pdf}-page"; done
      - name: Publish to the screenshots branch
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP/shots"
          ls -la
          git init -q -b screenshots
          git add -A
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -qm "Screenshots at $(date -u +%FT%TZ)"
          branch="${SHOTS_BRANCH:-screenshots}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:$branch"
          echo "::notice title=$branch::$(ls | tr '\n' ' ')"
